<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Westeros — Procedural 2D World</title>
<style>
  :root { --bg:#12161c; --panel:#1c232d; --ink:#e6edf3; --muted:#8b98a5; --accent:#4a9eff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow:hidden; }
  #app { display:flex; height:100%; }
  #stage { position:relative; flex:1; min-width:0; }
  canvas { display:block; width:100%; height:100%; cursor:grab; image-rendering:pixelated; }
  canvas.dragging { cursor:grabbing; }
  #panel { width:280px; background:var(--panel); padding:16px; overflow-y:auto;
    border-left:1px solid #000; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:11px; line-height:1.5; }
  .group { display:flex; flex-direction:column; gap:6px; }
  label { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
  input[type=range] { width:100%; }
  input[type=number], input[type=text] { width:100%; background:#0d1117; border:1px solid #30363d;
    color:var(--ink); border-radius:6px; padding:6px; font-family:inherit; font-size:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px;
    font-family:inherit; font-weight:600; cursor:pointer; font-size:13px; }
  button.sec { background:#30363d; }
  button:hover { filter:brightness(1.1); }
  .toggles { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .toggles label { font-size:11px; color:var(--ink); display:flex; gap:6px; align-items:center;
    background:#0d1117; padding:5px 7px; border-radius:6px; cursor:pointer; }
  .row { display:flex; gap:8px; }
  .legend { font-size:11px; display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; }
  .sw { width:14px; height:14px; border-radius:3px; }
  #tip { position:absolute; left:10px; top:10px; background:rgba(0,0,0,.6); padding:6px 10px;
    border-radius:6px; font-size:11px; pointer-events:none; white-space:pre; line-height:1.4; }
  #stat { color:var(--muted); font-size:11px; }
  hr { border:0; border-top:1px solid #30363d; margin:2px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tip">hover the map</div>
  </div>
  <div id="panel">
    <div>
      <h1>Westeros</h1>
      <div class="sub">Two-tier chunked world: coarse global skeleton + on-demand fine chunks. Drag to pan, scroll to zoom.</div>
    </div>
    <hr/>
    <div class="group">
      <label>Seed</label>
      <div class="row">
        <input type="text" id="seed" value="amarok" />
        <button class="sec" id="rnd" style="flex:0 0 auto">🎲</button>
      </div>
    </div>
    <div class="group">
      <label>Sea level <span id="seaLbl">0.42</span></label>
      <input type="range" id="sea" min="0.20" max="0.65" step="0.01" value="0.42" />
    </div>
    <div class="group">
      <label>Mountain level <span id="mtnLbl">0.78</span></label>
      <input type="range" id="mtn" min="0.60" max="0.95" step="0.01" value="0.78" />
    </div>
    <div class="group">
      <label>River density <span id="rivLbl">120</span></label>
      <input type="range" id="riv" min="30" max="400" step="10" value="120" />
    </div>
    <div class="group">
      <label>Settlements <span id="setLbl">400</span></label>
      <input type="range" id="setn" min="0" max="1200" step="20" value="400" />
    </div>
    <div class="group">
      <label>World size <span id="worldLbl">256</span></label>
      <input type="range" id="worldSz" min="128" max="512" step="64" value="256" />
    </div>
    <button id="gen">Regenerate</button>
    <hr/>
    <div class="group">
      <label>Layers</label>
      <div class="toggles" id="toggles"></div>
    </div>
    <hr/>
    <div class="group">
      <label>Legend</label>
      <div class="legend" id="legend"></div>
    </div>
    <div id="stat"></div>
  </div>
</div>
<script type="module" src="scripts/main.js"></script>
</body>
</html>
